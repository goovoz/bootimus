# [bootimus-fork L1] 本仓库启用了「actions 必须固定到完整 commit SHA」策略，
# 上游的 ci.yml 用的是浮动 tag（@v4/@v5），在 fork 里会在 Set up job 阶段被拒，
# 因此只把 uses: 固定到 SHA（不改任何逻辑）。升级 SHA 见 docs/RELEASING.md。
name: CI

# Runs once per change: pull requests test the result of merging into the
# target branch; pushes to main verify the merge itself (and build the
# container image). Branches without an open PR don't run CI. Tag pushes are
# handled by release.yml, which stamps the version and pushes the image.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Integration test (throwaway OIDC provider)
        run: make test-integration

      - name: Build
        run: make build

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Derive snapshot version
        id: version
        run: echo "version=$(cat VERSION)-snapshot.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
