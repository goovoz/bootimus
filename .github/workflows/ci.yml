# [bootimus-fork L1] 上游的 action 主版本还是 node20 时代的（@v4/@v5），
# GitHub 已把 runner 强制在 Node.js 24 上，这里只把 uses: 升到声明 node24 的主版本
# （actions/checkout@v7、setup-go@v7、buildx@v4、build-push@v7），逻辑不动。
# 版本对照见 docs/RELEASING.md。
name: CI

# Runs once per change: pull requests test the result of merging into the
# target branch; pushes to main verify the merge itself (and build the
# container image). Branches without an open PR don't run CI. Tag pushes are
# handled by release.yml, which stamps the version and pushes the image.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # node24

      - uses: actions/setup-go@v7  # node24
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7  # node24

      - uses: docker/setup-buildx-action@v4  # node24

      - name: Derive snapshot version
        id: version
        run: echo "version=$(cat VERSION)-snapshot.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7  # node24
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
