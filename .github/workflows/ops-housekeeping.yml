name: Ops Housekeeping (fork)

# 合并原 4 个每日巡检 cron（patch-risk / cache-housekeeping / ghcr-retention / dockerhub-retention）
# 为单一调度入口，顺序串跑；各子 workflow 仍可单独手动触发，retention 的
# workflow_run（Release 完成后清理）触发不变。注册刷新：2026-11-24
on:
  schedule:
    - cron: "23 20 * * *" # 每天 20:23 UTC（北京时间次日 04:23）
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  packages: write

jobs:
  patch-risk:
    uses: ./.github/workflows/patch-risk.yml
    secrets: inherit
  cache-housekeeping:
    needs: [patch-risk]
    uses: ./.github/workflows/cache-housekeeping.yml
    secrets: inherit
  ghcr-retention:
    needs: [cache-housekeeping]
    uses: ./.github/workflows/ghcr-retention.yml
    secrets: inherit
  dockerhub-retention:
    needs: [ghcr-retention]
    uses: ./.github/workflows/dockerhub-retention.yml
    secrets: inherit
