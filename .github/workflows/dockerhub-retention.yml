name: Docker Hub retention (fork)

# [bootimus-fork L0] Docker Hub 上的 tag 清理，策略与 ghcr-retention.yml 对齐：
# 每个版本号只留最新一次构建 —— 即每个 base 只保留 last_updated 最新的那个
# <base>-g<sha>，以及与它同 digest 的 sha-<sha>；纯版本号和 latest 全留。
#
# 为什么单独一个 workflow：构建成功时清理失败不该把构建标红；每天定时跑一次
# 能兜住手动推送和历史遗留；认证只需要 Hub 的 token，权限最小。
#
# 触发：Release (fork) 完成之后、每天 05:37（北京时间）兜底、workflow_dispatch（可 dry-run）

on:
  workflow_run:
    workflows: ["Release (fork)"]
    types: [completed]
  schedule:
    - cron: "37 21 * * *" # 05:37 CST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = 只打印计划，不删除"
        type: choice
        options:
          - "false"
          - "true"
        default: "true"
        required: false
      keep_tags:
        description: "额外保留的 tag（逗号分隔；留空则按默认策略）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: dockerhub-retention
  cancel-in-progress: false

jobs:
  prune:
    name: 每个版本号只保留最新一次构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # node24

      - name: 清理 Docker Hub 上的旧 tag
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REGISTRY_IMAGE: deemop/bootimus
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          HUB_KEEP_TAGS: ${{ inputs.keep_tags }}
        run: python3 .github/scripts/prune-dockerhub-tags.py
