name: Release (fork)
# [bootimus-fork L0] fork 自己的发布流水线。
# 与上游 release.yml 产物一致（4 个平台二进制 + SHA256SUMS + GitHub Release），
# 区别：
#   · Release **按版本号建，一个版本号一个**；正文只有自动生成的 release notes，
#     **不写任何构建记录**（版本串 / commit / 补丁清单 / 镜像 digest 都不写，
#     digest 只出现在每次运行的 Job Summary 里）；
#   · 同一个版本号再构建，只刷新 Release 上的资产，不往正文追加内容；
#   · 镜像推到 ghcr.io/goovoz/bootimus，旧 digest 由 ghcr-retention.yml 定期清掉。
#
# 版本口径（重要）：
#   基线版本 = VERSION 文件 / tag / 手动输入，纯 x.y.z，**必须与上游保持一致**，
#              因为 fork-follow-upstream-release.yml 用它和上游 releases/latest 比大小。
#   构建修订 = 本次构建所在 commit 的短 SHA（7 位）。
#   二进制版本字符串 = <基线>+g<修订>   例如 0.1.77+gd5b132e（semver build metadata，比较时被忽略）
#   镜像 tag         = <基线>-g<修订>   例如 0.1.77-gd5b132e（docker tag 不允许 +）
#                      + sha-<修订>     + <基线>（该基线上最新构建，会漂移） + latest（会漂移）
#
# 为什么不直接把 VERSION 升成 0.1.78：
#   升上去之后本地版本会一直高于上游，跟随流水线会判定「本地上游已同步」，
#   上游真发 0.1.78 时反而拉不下来；tag 也会和上游将来的 v0.1.78 撞车。
#   所以基线跟着上游走，构建之间靠 +g<sha> / -g<sha> 区分。
#
# 触发：
#   · 推送 v* 标签（推荐，watcher 或手动）
#   · workflow_dispatch（可手填版本号做冷启动）

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "基线版本号 x.y.z（留空则取 tag 或 VERSION 文件）"
        required: false
        default: ""

permissions:
  contents: write # 创建 Release、上传资产
  packages: write # 推 ghcr 镜像
  actions: write # 构建前清理缓存（删 Actions 缓存要这个权限）

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/goovoz/bootimus

jobs:
  binaries:
    name: 构建二进制并发布 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # node24

      - uses: actions/setup-go@v7  # node24
        with:
          go-version-file: go.mod
          cache: true

      - name: 解析版本号
        id: version
        run: |
          set -euo pipefail
          BASE=""
          if [ -n "${{ inputs.version }}" ]; then
            BASE="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            BASE="${GITHUB_REF_NAME#v}"
          else
            BASE=$(tr -d '[:space:]' < VERSION)
          fi
          # 允许直接传 0.1.77+gabc1234 / 0.1.77-gabc1234，统一剥回基线版本
          BASE="${BASE%%+*}"
          BASE="${BASE%%-g*}"
          [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::版本号不合法: '$BASE'"; exit 1; }

          REV=$(git rev-parse --short=7 HEAD)
          {
            echo "base=$BASE"
            echo "rev=$REV"
            echo "build_version=${BASE}+g${REV}"
            echo "tag_version=${BASE}-g${REV}"
          } >> "$GITHUB_OUTPUT"
          echo "基线 ${BASE} / 构建 ${REV} / 版本串 ${BASE}+g${REV}"

      - name: 构建 4 个平台的二进制
        # 基线版本写进 profiles（保持 semver 干净），版本串只进 ldflags
        run: |
          set -euo pipefail
          make binaries VERSION="${{ steps.version.outputs.base }}" \
            LDFLAGS="-w -s -X bootimus/internal/server.Version=${{ steps.version.outputs.build_version }}"
          ./bootimus-linux-amd64 version

      - name: 生成校验和
        run: |
          set -euo pipefail
          sha256sum bootimus-* > SHA256SUMS
          cat SHA256SUMS

      # 每个版本号一个 Release；同一个版本号再跑只刷新资产。
      #
      # 正文固定一行 Full Changelog，并且每次整体覆盖（append_body=false），
      # 所以同一个版本号构建多少次都只有一条。
      # 之前用 generate_release_notes: true：GitHub 生成的正文是「追加」到已有正文
      # 后面的，同一个 tag 每构建一次就多一行 Full Changelog（v0.1.77 上堆到了 4 行）。
      - name: 创建/更新 Release 并上传资产
        uses: softprops/action-gh-release@v3  # node24
        with:
          tag_name: v${{ steps.version.outputs.base }}
          name: v${{ steps.version.outputs.base }}
          body: |
            **Full Changelog**: https://github.com/${{ github.repository }}/commits/v${{ steps.version.outputs.base }}
          append_body: false
          files: |
            bootimus-*
            SHA256SUMS
          fail_on_unmatched_files: true

  docker:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # node24

      - name: 解析版本号
        id: version
        run: |
          set -euo pipefail
          BASE=""
          if [ -n "${{ inputs.version }}" ]; then
            BASE="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            BASE="${GITHUB_REF_NAME#v}"
          else
            BASE=$(tr -d '[:space:]' < VERSION)
          fi
          BASE="${BASE%%+*}"
          BASE="${BASE%%-g*}"
          [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::版本号不合法: '$BASE'"; exit 1; }

          REV=$(git rev-parse --short=7 HEAD)
          {
            echo "base=$BASE"
            echo "rev=$REV"
            echo "build_version=${BASE}+g${REV}"
            echo "tag_version=${BASE}-g${REV}"
          } >> "$GITHUB_OUTPUT"
          echo "基线 ${BASE} / 构建 ${REV} / 镜像 tag ${BASE}-g${REV}"

      - name: 同步内嵌 profiles 版本
        run: make sync-profiles VERSION=${{ steps.version.outputs.base }}

      # 缓存配额 10 GB，多架构构建每次都会往里堆 buildkit 层缓存；顶到上限后 GitHub
      # 开始随机淘汰，构建可能刚好丢掉自己要用的层而白跑。开跑前先按预算腾空间，
      # 清理逻辑与 cache-housekeeping.yml 共用同一个脚本。
      - name: 构建前腾缓存空间
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          BUDGET_GB: "6"
        run: |
          if [ -f .github/scripts/prune-caches.py ]; then
            python3 .github/scripts/prune-caches.py || echo "::warning::缓存清理失败，不影响本次构建"
          else
            echo "跳过：仓库里没有 .github/scripts/prune-caches.py"
          fi

      - uses: docker/setup-qemu-action@v4  # node24

      - uses: docker/setup-buildx-action@v4  # node24

      - name: 登录 ghcr.io
        uses: docker/login-action@v4  # node24
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7  # node24
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.build_version }}
          # 前两个 tag 不可变（每次构建唯一），后两个会漂移，按需取用
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag_version }}
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.rev }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.base }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.build_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=bootimus
          # 关掉 attestation：否则 index 里会多出 unknown/unknown 平台条目
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 结果汇总
        if: always()
        run: |
          {
            echo "## fork release"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 基线版本 | v${{ steps.version.outputs.base }} |"
            echo "| 版本串 | \`${{ steps.version.outputs.build_version }}\` |"
            echo "| 二进制 | bootimus-linux-{amd64,arm64}、bootimus-windows-{amd64,arm64} + SHA256SUMS（挂在 Release 上） |"
            echo "| 不可变 tag | \`${IMAGE}:${{ steps.version.outputs.tag_version }}\`、\`${IMAGE}:sha-${{ steps.version.outputs.rev }}\` |"
            echo "| 漂移 tag | \`${IMAGE}:${{ steps.version.outputs.base }}\`、\`${IMAGE}:latest\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo ""
            echo "可复现引用（推荐写进 compose）："
            echo ""
            echo '```yaml'
            echo "image: ${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
