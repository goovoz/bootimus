name: Sync Upstream (keep fork patches)

# 每天检查上游 garybowers/bootimus：
# 有新提交时先判定 fork 补丁是否仍必要 —— 需要就 rebase 重放，上游已实现就自动退役让位。
# 机制与判定规则见 docs/FORK-PATCHES.md。

on:
  schedule:
    - cron: "23 19 * * *" # 每天 19:23 UTC（北京时间次日 03:23）
  workflow_dispatch:
    inputs:
      mode:
        description: "direct = 直接更新 main；pr = 只开 PR 等人工合并"
        type: choice
        options:
          - direct
          - pr
        default: direct
        required: false
      keep_days:
        description: "过期冲突分支保留天数（默认 7）"
        required: false
        default: "7"

permissions:
  contents: write
  pull-requests: write # 清理冲突分支时要查有没有开着的 PR

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: garybowers/bootimus
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7  # node24
        with:
          fetch-depth: 0
          # GITHUB_TOKEN 推不了 .github/workflows/** ：GitHub 硬性禁止 installation token
          # 带 `workflows` 权限（2026-10-25 实测：冲突分支含 ci.yml 改动 → remote rejected）。
          # 所以优先用带 workflows 写权限的 PAT（仓库 secret SYNC_TOKEN）；
          # 没配置时退回默认 token，其余步骤照常，只有涉及 workflow 文件的推送会失败并给出明确提示。
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 上游是否有新提交
        id: gate
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          UP=$(git rev-parse FETCH_HEAD)
          echo "sha=${UP}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "${UP}" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无新提交（${UP}），本次不做任何改动"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "上游有新提交（共 $(git rev-list --count "HEAD..${UP}") 个，最多列 30 个）："
            # 不要写成 `git log ... | head -30`：head 读满就关管道，git 吃 SIGPIPE 退出 141，
            # 配上 set -o pipefail 会让整步失败。2026-10-24 上游一次推了 115 个提交，
            # 同步就是被这一行卡死的（之后每次都红在门禁，fork 静默落后 126 个提交）。
            git log --oneline --max-count=30 "HEAD..${UP}"
          fi

      # [bootimus-fork L0] 动手前先算清楚这次会撞在哪：把两边相对 base 改的行求交集。
      # 只做提示、不拦流程 —— 真撞了下面的 rebase 会照常把现场推成 sync-conflict 分支。
      - name: 补丁冲突风险预检
        if: steps.gate.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          git fetch --no-tags --quiet upstream "${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"
          python3 ops/ci/patch-risk.py --upstream "upstream/${UPSTREAM_BRANCH}" | tee /tmp/risk.txt || true
          {
            echo "## 补丁冲突风险预检"
            echo ""
            echo '```'
            cat /tmp/risk.txt 2>/dev/null || echo "（审计脚本没有输出）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        if: steps.gate.outputs.changed == 'true'
        uses: actions/setup-go@v7  # node24
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验提交标记并判定补丁是否仍必要
        id: inspect
        if: steps.gate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          UP="${{ steps.gate.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 纪律：main 上超出上游的提交必须是「补丁」或「元数据」，否则自动同步不安全
          bad=0
          patches=0
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            body=$(git log -1 --format='%B' "$c")
            if grep -q '^Fork-Patch: ' <<<"$body"; then
              patches=$((patches + 1))
            elif grep -q '^Fork-Meta: ' <<<"$body"; then
              :
            else
              echo "::error::提交 ${c:0:8} 既不是上游提交，也没有 Fork-Patch / Fork-Meta 标记：$(git log -1 --format='%s' "$c")"
              bad=1
            fi
          done < <(git rev-list --reverse "${UP}..HEAD")
          if [ "$bad" -ne 0 ]; then
            echo "::error::main 上存在未标记的本地提交，自动同步停手，请人工处理（见 docs/FORK-PATCHES.md）"
            exit 1
          fi
          echo "本地补丁提交数：${patches}"

          # 判定跑在【上游代码】上，不跑自己的实现
          mkdir -p /tmp/upstream-tree
          git archive "${UP}" | tar -x -C /tmp/upstream-tree
          # 探测器崩溃不能把整步拖死：结果为空会被后面当成 UNKNOWN，而 UNKNOWN 现在是停手，
          # 比「管道失败导致 job 直接红掉、什么信息都没有」好排查。
          bash .github/scripts/detect-iso-url-no-suffix.sh /tmp/upstream-tree | tee /tmp/detect.txt || true

          # [bootimus-fork] 第二个补丁：中文覆盖。只做判定与告警，不参与自动退役逻辑
          bash .github/scripts/detect-i18n-zh-full.sh /tmp/upstream-tree | tee /tmp/detect-i18n.txt || true

          # [bootimus-fork] 下载代理补丁：只判定与告警
          bash .github/scripts/detect-download-proxy.sh /tmp/upstream-tree | tee /tmp/detect-dlproxy.txt || true

          # [bootimus-fork] 断点续传补丁：只判定与告警
          bash .github/scripts/detect-download-resume.sh /tmp/upstream-tree | tee /tmp/detect-resume.txt || true

          # [bootimus-fork] 自动安装生成器补丁：只判定与告警
          bash .github/scripts/detect-autoinstall-generator.sh /tmp/upstream-tree | tee /tmp/detect-aigen.txt || true

          # [bootimus-fork] ISO 目录版本号解析补丁：只判定与告警
          bash .github/scripts/detect-iso-catalog-resolve.sh /tmp/upstream-tree | tee /tmp/detect-isores.txt || true

          # [bootimus-fork] 删除已吊销令牌补丁：只判定与告警
          bash .github/scripts/detect-token-purge.sh /tmp/upstream-tree | tee /tmp/detect-purge.txt || true


          RESULT=$(sed -n 's/^RESULT=//p' /tmp/detect.txt | head -1)
          REASON=$(sed -n 's/^REASON=//p' /tmp/detect.txt | head -1)
          {
            echo "result=${RESULT:-UNKNOWN}"
            echo "reason=${REASON}"
            echo "patches=${patches}"
            echo "i18n_result=$(sed -n 's/^RESULT=//p' /tmp/detect-i18n.txt | head -1)"
            echo "i18n_reason=$(sed -n 's/^REASON=//p' /tmp/detect-i18n.txt | head -1)"
            echo "dlproxy_result=$(sed -n 's/^RESULT=//p' /tmp/detect-dlproxy.txt | head -1)"
            echo "dlproxy_reason=$(sed -n 's/^REASON=//p' /tmp/detect-dlproxy.txt | head -1)"
            echo "resume_result=$(sed -n 's/^RESULT=//p' /tmp/detect-resume.txt | head -1)"
            echo "resume_reason=$(sed -n 's/^REASON=//p' /tmp/detect-resume.txt | head -1)"
            echo "aigen_result=$(sed -n 's/^RESULT=//p' /tmp/detect-aigen.txt | head -1)"
            echo "aigen_reason=$(sed -n 's/^REASON=//p' /tmp/detect-aigen.txt | head -1)"
            echo "isores_result=$(sed -n 's/^RESULT=//p' /tmp/detect-isores.txt | head -1)"
            echo "isores_reason=$(sed -n 's/^REASON=//p' /tmp/detect-isores.txt | head -1)"
            echo "purge_result=$(sed -n 's/^RESULT=//p' /tmp/detect-purge.txt | head -1)"
            echo "purge_reason=$(sed -n 's/^REASON=//p' /tmp/detect-purge.txt | head -1)"
            echo "branch=sync/$(date -u +%Y%m%d-%H%M)"
          } >> "$GITHUB_OUTPUT"

      - name: 中文覆盖补丁是否该让位（仅告警）
        if: steps.inspect.outputs.i18n_result == 'IMPLEMENTED'
        run: |
          echo "::warning::上游可能已自行补齐中文覆盖：${{ steps.inspect.outputs.i18n_reason }}"
          echo "补丁 i18n-zh-full 未自动退役（自动删除会一次丢掉 688 条译文），请人工确认后再移除。"

      - name: 下载代理补丁是否该让位（仅告警）
        if: steps.inspect.outputs.dlproxy_result == 'IMPLEMENTED'
        run: |
          echo "::warning::上游可能已自行支持下载代理：${{ steps.inspect.outputs.dlproxy_reason }}"
          echo "补丁 download-proxy 未自动退役，请人工核对设置页与配置存储后再移除。"

      - name: 断点续传补丁是否该让位（仅告警）
        if: steps.inspect.outputs.resume_result == 'IMPLEMENTED'
        run: |
          echo "::warning::上游可能已自行支持断点续传：${{ steps.inspect.outputs.resume_reason }}"
          echo "补丁 download-resume 未自动退役，请人工确认上游续传等价（If-Range / 半成品命名）后再移除。"

      - name: 自动安装生成器补丁是否该让位（仅告警）
        if: steps.inspect.outputs.aigen_result == 'IMPLEMENTED'
        run: |
          echo "::warning::上游可能已自带自动安装模板生成：${{ steps.inspect.outputs.aigen_reason }}"
          echo "补丁 autoinstall-generator 未自动退役，请人工比对模板覆盖面后再移除。"

      - name: 删除已吊销令牌补丁是否该让位（仅告警）
        if: steps.inspect.outputs.purge_result == 'IMPLEMENTED' || steps.inspect.outputs.purge_result == 'SUSPECT'
        run: |
          echo "::warning::上游可能已自行支持删除令牌：${{ steps.inspect.outputs.purge_reason }}"
          echo "补丁 token-purge 未自动退役（同时涉及存储层接口与 UI，自动摘除风险高），请人工确认后再移除。"

      - name: ISO 目录版本号解析补丁是否该让位（仅告警）
        if: steps.inspect.outputs.isores_result == 'IMPLEMENTED'
        run: |
          echo "::warning::上游可能已自带 ISO URL 解析：${{ steps.inspect.outputs.isores_reason }}"
          echo "补丁 iso-catalog-resolve 未自动退役，请人工确认覆盖范围后再移除。"


      - name: 上游已实现 → 退役补丁
        id: retire
        if: steps.inspect.outputs.result == 'IMPLEMENTED'
        run: |
          set -euo pipefail
          UP="${{ steps.gate.outputs.sha }}"
          PATCH_ID="iso-url-no-suffix"
          OLD="$(git rev-parse HEAD)"
          echo "上游已自行实现 ${PATCH_ID}，从 main 上摘掉这组补丁，其余补丁与元数据照常保留"

          # 先把当前 main 原样存进归档分支：自动判定错了也能一条命令拿回来
          ARCH="fork-archive/${PATCH_ID}-$(date -u +%Y%m%d-%H%M%S)"
          git branch -f "${ARCH}" "${OLD}"
          git push origin "${ARCH}"
          echo "补丁已归档到 ${ARCH}"

          # 关键：这里曾经是 `git reset --hard "${UP}"`。那会把 main 上「超出上游的全部提交」
          # 一次性丢掉 —— 6 组补丁（28 个提交）加 21 个元数据提交（发布流水线、watchdog、
          # 文档、i18n 工具链）全没了。退役的语义是「只让这一组补丁让位」，
          # 所以正确做法是以上游为新基线，按原顺序重放「除目标补丁之外」的全部提交。
          REPLAY=()
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            if git log -1 --format='%B' "$c" | grep -qx "Fork-Patch: ${PATCH_ID}"; then
              echo "跳过 ${c:0:8} $(git log -1 --format=%s "$c")"
              continue
            fi
            REPLAY+=("$c")
          done < <(git rev-list --reverse "${UP}..${OLD}")
          echo "待重放 ${#REPLAY[@]} 个提交（已排除 ${PATCH_ID} 的全部提交）"

          git checkout -q -B "retire/${PATCH_ID}" "${UP}"
          for c in "${REPLAY[@]}"; do
            if ! git cherry-pick "$c" >/dev/null 2>&1; then
              echo "::error::重放 ${c:0:8} 时冲突，退役中止：main 未改动，补丁已完整归档到 ${ARCH}"
              git cherry-pick --abort || true
              exit 1
            fi
          done

          python3 .github/scripts/mark_retired.py "${PATCH_ID}" "${UP}" \
            "上游在 ${UP:0:8} 自行实现同等能力，补丁自动退役（归档 ${ARCH}）"
          git add -A
          git commit -m "chore(fork): retire patch ${PATCH_ID}" \
            -m "上游 ${UP:0:8} 已自行实现该能力，按约定让上游实现在位：只摘掉 ${PATCH_ID} 这组提交，其余补丁与元数据原样重放。补丁原文归档在 ${ARCH}。" \
            -m "Fork-Meta: retire-${PATCH_ID}"
          echo "archive_branch=${ARCH}" >> "$GITHUB_OUTPUT"
          git log --oneline -3

      - name: 判定失败 → 停手
        # 只有「上游确实有新提交、但探测器没给出可用判定」才停手。
        # 上游无新提交时判定步骤根本不会跑，outputs 是空的，不能把它当成 UNKNOWN。
        if: steps.gate.outputs.changed == 'true' && steps.inspect.outputs.result != 'IMPLEMENTED' && steps.inspect.outputs.result != 'NEEDED' && steps.inspect.outputs.result != 'SUSPECT'
        run: |
          echo "::error::补丁判定为 '${{ steps.inspect.outputs.result }}'（UNKNOWN/空），按约定停手：不 rebase、不推送，等人工确认上游结构变化"
          echo "判定依据：${{ steps.inspect.outputs.reason }}"
          exit 1

      - name: 上游未实现 → 重放补丁
        id: keep
        # UNKNOWN 不再走到这里（上面有专门的停手步骤）：判定不清时宁可不动
        if: steps.inspect.outputs.result == 'NEEDED' || steps.inspect.outputs.result == 'SUSPECT'
        run: |
          set -uo pipefail
          UP="${{ steps.gate.outputs.sha }}"
          if git rebase "${UP}"; then
            echo "补丁已成功重放到上游 ${UP:0:8}"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::补丁与上游冲突，转为人工处理"
          git rebase --abort || true
          BR="sync-conflict/$(date -u +%Y%m%d-%H%M)"
          git checkout -B "${BR}"
          git merge "${UP}" --no-edit || true
          git add -A
          git commit -m "wip: 上游 ${UP:0:8} 与 fork 补丁冲突，待人工解决" \
            -m "冲突标记已原样提交，便于在 PR 里逐块处理。解决后请保留 Fork-Patch trailer。" \
            -m "Fork-Meta: conflict" || true
          if ! git push -u origin "${BR}" 2>/tmp/push.err; then
            if grep -q 'without .workflows. permission' /tmp/push.err; then
              echo "::error::推送被拒：GITHUB_TOKEN 不能修改 .github/workflows/**（GitHub 硬限制）。请配置仓库 secret SYNC_TOKEN（带 workflows 写权限的 PAT）后重跑；重跑会重新生成冲突分支。"
            else
              tail -5 /tmp/push.err | sed 's/^/  /'
              echo "::error::冲突分支 ${BR} 推送失败"
            fi
            exit 1
          fi
          {
            echo "conflict=true"
            echo "conflict_branch=${BR}"
          } >> "$GITHUB_OUTPUT"

      # [bootimus-fork L0] 冲突时把审计结论落成文件，给下面 PR 正文用。
      # 价值：PR 里直接看到「哪个补丁、哪个文件、几行」，不用人去翻上千行日志。
      - name: 冲突风险审计（冲突时）
        if: steps.keep.outputs.conflict == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          # 必须切回 main 再审计：上一步结束时 HEAD 停在 sync-conflict/* 上，
          # 那个分支已经把上游 merge 并提交了，两边「相对 base 的改动」互相抵消，交集恒为空。
          git checkout -q main
          git fetch --no-tags --quiet upstream "${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}" || true
          python3 ops/ci/patch-risk.py --upstream "upstream/${UPSTREAM_BRANCH}" > /tmp/conflict-audit.txt 2>&1 || true
          sed -n '/^A\. 确定性冲突/,/^$/p' /tmp/conflict-audit.txt

      - name: 编译与测试
        if: steps.gate.outputs.changed == 'true' && steps.keep.outputs.conflict != 'true'
        run: |
          set -euo pipefail
          echo "=== go build ./... ==="
          go build ./...
          # 全量测试：以前只跑 ./internal/admin/，autoinstall 的渲染/校验用例（13 个）
          # 只有在本地 make 时才会被跑到，重放补丁把模板改坏了也发现不了。
          echo "=== go vet ./... ==="
          go vet ./...
          echo "=== go test ./... ==="
          go test ./... -count=1

      - name: 推送 main
        id: push
        if: steps.gate.outputs.changed == 'true' && github.event.inputs.mode != 'pr' && steps.keep.outputs.conflict != 'true'
        run: |
          set -euo pipefail
          # rebase / 退役都会改写补丁提交的 SHA，这里用 force-with-lease 而不是 force
          if ! git push --force-with-lease origin HEAD:main 2>/tmp/push.err; then
            if grep -q 'without .workflows. permission' /tmp/push.err; then
              echo "::error::推送被拒：GITHUB_TOKEN 不能修改 .github/workflows/**（GitHub 硬限制）。请配置仓库 secret SYNC_TOKEN（带 workflows 写权限的 PAT）后重跑。"
            else
              tail -5 /tmp/push.err | sed 's/^/  /'
              echo "::error::推送 main 失败"
            fi
            exit 1
          fi
          echo "main 已更新到 $(git rev-parse --short HEAD)"


      # 同步只更新代码，制品不会自己重建。上游发版晚于我们上次构建时，
      # main 的 VERSION 已经是新的、镜像还停在旧版本（0.1.79 那次就是这样）。
      # 这里在推送成功后直接触发发布，条件与「推送 main」保持一致。
      - name: 同步后触发构建
        if: steps.push.outcome == 'success'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::warning::没有 SYNC_TOKEN，跳过自动构建；请手动触发 Release (fork)"
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -d '{"ref":"main"}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/fork-release.yml/dispatches")
          if [ "$code" = "204" ]; then
            echo "已触发 Release (fork)（HTTP 204）"
          else
            echo "::warning::触发构建失败 HTTP $code"
            cat /tmp/dispatch.json || true
          fi

      - name: 开 PR（pr 模式或冲突）
        if: steps.gate.outputs.changed == 'true' && (github.event.inputs.mode == 'pr' || steps.keep.outputs.conflict == 'true')
        env:
          # 用 SYNC_TOKEN 时 PR 才能建出来：仓库默认不允许 GITHUB_TOKEN 创建 PR
          # （2026-10-25 实测：gh pr create → GraphQL "Resource not accessible by integration"）。
          # 没有 secret 时退回默认 token，创建失败只会告警、不阻塞冲突分支的推送。
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ "${{ steps.keep.outputs.conflict }}" = "true" ]; then
            BR="${{ steps.keep.outputs.conflict_branch }}"
            TITLE="[需人工] 上游 ${{ steps.gate.outputs.sha }} 与 fork 补丁冲突"
            BODY="自动 rebase 失败，冲突标记已原样提交到本分支。解决冲突后合并即可，注意保留 \`Fork-Patch\` trailer 与 \`[bootimus-fork L1]\` 锚点。"
            if [ -s /tmp/conflict-audit.txt ]; then
              BODY="$(printf '%s\n\n### 冲突风险审计\n\n\x60\x60\x60\n%s\n\x60\x60\x60' "$BODY" "$(cat /tmp/conflict-audit.txt)")"
            fi
          else
            BR="${{ steps.inspect.outputs.branch }}"
            git checkout -B "$BR"
            git push -u origin "$BR"
            TITLE="sync: 上游 ${{ steps.gate.outputs.sha }}（判定 ${{ steps.inspect.outputs.result }}）"
            BODY="自动同步产生的 PR。判定结果：${{ steps.inspect.outputs.result }} —— ${{ steps.inspect.outputs.reason }}"
          fi
          if gh pr create --base main --head "$BR" --title "$TITLE" --body "$BODY"; then
            echo "PR 已创建"
          else
            echo "::warning::PR 创建失败（仓库可能未开启 Actions 创建 PR 的权限）。分支 $BR 已推送，可手动开 PR。"
          fi

      - name: 冲突时让工作流失败（提醒人工）
        if: steps.keep.outputs.conflict == 'true'
        run: |
          echo "::error::fork 补丁与上游冲突，需要人工解决（见刚推送的 sync-conflict 分支 / PR）"
          exit 1

      - name: 结果汇总
        if: always()
        run: |
          {
            echo "## 上游同步"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游 HEAD | \`${{ steps.gate.outputs.sha }}\` |"
            if [ "${{ steps.gate.outputs.changed }}" != "true" ]; then
              # 没有新提交时判定步骤不会执行，outputs 全空，别把空值当成判定结果
              echo "| 是否有新提交 | false |"
              echo "| 采取动作 | 无（已是最新，未做判定） |"
            else
              echo "| 是否有新提交 | true |"
              echo "| 本地补丁提交数 | ${{ steps.inspect.outputs.patches }} |"
              echo "| 补丁判定 | **${{ steps.inspect.outputs.result }}** |"
              echo "| 判定依据 | ${{ steps.inspect.outputs.reason }} |"
              if [ "${{ steps.inspect.outputs.result }}" = "IMPLEMENTED" ]; then
                echo "| 采取动作 | 上游已实现，补丁已退役（其余补丁已重放） |"
              elif [ "${{ steps.inspect.outputs.result }}" != "NEEDED" ] && [ "${{ steps.inspect.outputs.result }}" != "SUSPECT" ]; then
                echo "| 采取动作 | **判定失败（${{ steps.inspect.outputs.result }}），已停手** |"
              elif [ "${{ steps.keep.outputs.conflict }}" = "true" ]; then
                echo "| 采取动作 | **冲突待人工**（分支 \`${{ steps.keep.outputs.conflict_branch }}\`） |"
              else
                echo "| 采取动作 | 补丁已重放到新上游 |"
              fi
            fi
            echo ""
            echo "机制说明见 [docs/FORK-PATCHES.md](../blob/main/docs/FORK-PATCHES.md)。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 冲突分支只是「给人看现场」的临时载体，解决完就没用了。这里兜底清掉过期的：
      # 超过 keep_days 天且没有开着的 PR 才删，只碰 sync-conflict/*，绝不动 fork-archive/*。
      # 放在最后并 always()：即使本次同步失败/冲突，也要把更老的那些清掉。
      - name: 清理过期冲突分支
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ inputs.keep_days || '7' }}
        run: bash .github/scripts/prune-conflict-branches.sh
